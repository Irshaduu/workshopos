[project]
name = "workshopos"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1,<6.2",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.0",
]

# Code checks and formatting (ADR-0013).
[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
# E/W style, F real errors, I import order, UP modern Python,
# B likely bugs, DJ Django mistakes.
select = ["E", "W", "F", "I", "UP", "B", "DJ"]

# Tests (ADR-0013).
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
branch = true
source = ["."]
omit = [".venv/*", "*/migrations/*", "tests/*", "*/tests/*", "manage.py", "config/asgi.py", "config/wsgi.py"]
